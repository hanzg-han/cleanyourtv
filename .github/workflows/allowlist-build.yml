name: Allowlist launcher build

# Builds the cleanyourtv launcher with the Xiaomi cloud-control allowlisted
# package name (com.ts.launcher) and uploads the release APK as an artifact.
# See docs/devices/xiaomi-mitv-aetp0-dofus.md for the full procedure.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK (com.ts.launcher)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK with allowlisted package name
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PlauncherApplicationId=com.ts.launcher
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-com-ts-launcher
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
